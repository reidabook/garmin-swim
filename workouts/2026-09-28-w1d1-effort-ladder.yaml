name: "W1D1 Effort Ladder"
date: 2026-09-28
pool: {length: 25, unit: yd}
description: "Warm-up 500 + main 1000. Go very easy at first so you can increase speed on the faster efforts; check pace on your watch. Mastering this set = getting faster with each effort step while staying relaxed and in control of your breathing."
steps:
  # --- Week 1 warm-up (500) ---
  - {type: warmup, distance: 100, stroke: free, notes: "Fins optional"}
  - repeat: 4
    steps:
      - {type: warmup, lap: true, notes: "Sink down: deep breath, slowly exhale and sink to the bottom. Mouth exhale OK. Relax, be calm, enjoy being submerged. Lap when done."}
  - repeat: 2
    steps:
      - {type: warmup, distance: 100, stroke: free, notes: "Exhale from the NOSE (not mouth). Carry the relaxed sink-down feeling into your swimming."}
  - {type: drill, distance: 50, stroke: free, equipment: kickboard, notes: "Side breathing drill w/ kickboard + fins. Keep part of bottom goggle in the water, turn head to side to breathe. Side 1."}
  - {type: drill, distance: 50, stroke: free, equipment: kickboard, notes: "Side breathing drill w/ kickboard + fins. SWAP SIDES. Bottom goggle stays in water."}
  - {type: warmup, distance: 100, stroke: free, notes: "Breathe to the side; find the sweet spot where no water gets in your mouth."}
  # --- Main set ---
  - repeat: 4
    steps:
      - {type: swim, distance: 100, stroke: free, notes: "60% effort – very easy"}
      - {rest: 30}
  - repeat: 3
    steps:
      - {type: swim, distance: 100, stroke: free, notes: "70% effort"}
      - {rest: 30}
  - repeat: 2
    steps:
      - {type: swim, distance: 100, stroke: free, notes: "80% effort"}
      - {rest: 30}
  - {type: swim, distance: 100, stroke: free, notes: "90% effort – faster than every rep before"}
  - {rest: 30}
