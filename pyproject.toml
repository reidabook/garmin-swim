[project]
name = "garmin-swim"
version = "0.1.0"
description = "Push swim workouts from YAML to Garmin Connect"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.16",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
garmin-swim = "garmin_swim.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
